name: tsuull-erp
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: erp_owner
      POSTGRES_DB: erp
      POSTGRES_PASSWORD: ${DB_OWNER_PASSWORD:?Set DB_OWNER_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U erp_owner -d erp']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks: [private]
  migrate:
    build: .
    image: tsuull-erp:3.0.0
    command: [sh, -c, 'node server/migrate.mjs && node server/grant.mjs']
    environment:
      DATABASE_URL: postgresql://erp_owner:${DB_OWNER_PASSWORD:?Set DB_OWNER_PASSWORD}@db:5432/erp
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    networks: [private]
    restart: 'no'
  app:
    image: tsuull-erp:3.0.0
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://erp_app:${APP_DB_PASSWORD:?Set APP_DB_PASSWORD}@db:5432/erp
      APP_ORIGIN: https://${ERP_DOMAIN:?Set ERP_DOMAIN}
      TRUST_PROXY: '1'
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:?Set MFA_ENCRYPTION_KEY}
      LOCAL_AI_URL: ${LOCAL_AI_URL:-}
      LOCAL_AI_MODEL: ${LOCAL_AI_MODEL:-}
      NO_PROXY: ${LOCAL_AI_NO_PROXY:-db,localhost,127.0.0.1}
      no_proxy: ${LOCAL_AI_NO_PROXY:-db,localhost,127.0.0.1}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [private, web]
  caddy:
    image: caddy:2-alpine
    environment:
      ERP_DOMAIN: ${ERP_DOMAIN:?Set ERP_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:-}
      # Keep internal Docker service traffic away from inherited Internet proxies.
      NO_PROXY: app,db,localhost,127.0.0.1
      no_proxy: app,db,localhost,127.0.0.1
    ports:
      - '${BIND_ADDRESS:-0.0.0.0}:${ERP_HTTP_PORT:-80}:80'
      - '${BIND_ADDRESS:-0.0.0.0}:${ERP_HTTPS_PORT:-443}:443'
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    networks: [web]
networks:
  private:
    internal: true
  web:
volumes:
  postgres_data:
  caddy_data:
  caddy_config:
