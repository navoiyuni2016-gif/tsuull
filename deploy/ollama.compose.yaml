# Run only on the dedicated university AI host, not VM 102 (3 GB).
name: tsuull-local-ai
services:
  ollama:
    image: ${OLLAMA_IMAGE:?Set a reviewed Ollama image tag or digest}
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NO_CLOUD: 'true'
      OLLAMA_NUM_PARALLEL: '1'
      OLLAMA_MAX_LOADED_MODELS: '1'
      OLLAMA_KEEP_ALIVE: 5m
    ports:
      - '${AI_BIND_ADDRESS:?Set AI server LAN IP}:11434:11434'
    volumes:
      - models:/root/.ollama
    mem_limit: ${OLLAMA_MEMORY_LIMIT:-6g}
    cpus: ${OLLAMA_CPUS:-2}
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: unless-stopped
volumes:
  models:
