# Insert into the EXISTING HTTPS server block for el.tsuull.uz.
# Do not overwrite another site's configuration or its certificates.
location / {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 8m;
    proxy_read_timeout 60s;
}
# If the HTTPS proxy is on a different machine, set proxy_pass to
# http://172.20.0.50:8080, set APP_BIND_ADDRESS=172.20.0.50 in .env,
# and restrict VM port 8080 to that proxy's source IP using your firewall.
